name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CUBELAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing repository secret CUBELAB_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/cubelab-release.jks"

      - name: Build signed release APK
        working-directory: native
        env:
          CUBELAB_STORE_FILE: ${{ runner.temp }}/cubelab-release.jks
          CUBELAB_STORE_PASSWORD: ${{ secrets.CUBELAB_STORE_PASSWORD }}
          CUBELAB_KEY_ALIAS: ${{ secrets.CUBELAB_KEY_ALIAS }}
          CUBELAB_KEY_PASSWORD: ${{ secrets.CUBELAB_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "${{ runner.temp }}/cubelab-release.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cubelab-release-${{ github.ref_name }}
          path: native/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "native/app/build/outputs/apk/release/app-release.apk#CubeLab-$GITHUB_REF_NAME.apk" \
            --generate-notes
